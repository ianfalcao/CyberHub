<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberHub | Cadastro</title>
    <meta name="author" content="Ian Falcão">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header class="cabecalho">
        <a class="logo" href="../index.html" aria-label="CyberHub - página inicial">CyberHub</a>

        <nav class="menu" aria-label="Navegação principal">
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="noticias.html">Notícias</a></li>
                <li><a href="vulnerabilidades.html">Vulnerabilidades</a></li>
                <li><a href="ferramentas.html">Ferramentas</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Criar Conta no CyberHub</h1>
        <p class="Bem_Vindo">Crie sua conta no nosso portal CyberHub.</p>
        <p class="Bem_Vindo">Seja Bem Vindo!</p>

        <form>
            <p>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </p>
            <p>
                <label for="confirmacao-senha">Confirmação de senha:</label>
                <input type="password" id="confirmacao-senha" name="confirmacao-senha" required>
            </p>
            <button type="button">Cadastrar</button>
        </form>

        <p><a href="login.html">Já tenho uma conta</a></p>
        <p><a href="../index.html">Voltar à página inicial</a></p>
    </main>

    <footer class="rodape">
        <a class="logo" href="../index.html">CyberHub</a>
        <p>Projeto acadêmico</p>
        <p>&copy; Criado por Ian Falcão</p>
    </footer>
</body>
</html>
